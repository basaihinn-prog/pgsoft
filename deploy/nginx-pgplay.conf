server {
    listen 80;
    listen [::]:80;
    server_name pgplay.online www.pgplay.online;
    root /var/www/pgplay/painel;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* ^/adm(?:/|$) {
        return 404;
    }

    location ~* ^/(test-db|setup-test-agent|create_test_agent)\.php$ {
        return 404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name panel.pgplay.online;
    root /var/www/pgplay/painel;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* ^/adm(?:/|$) {
        return 404;
    }

    location ~* ^/(test-db|setup-test-agent|create_test_agent)\.php$ {
        return 404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name games.pgplay.online;
    root /var/www/pgplay/api/public;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.pgplay.online;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
